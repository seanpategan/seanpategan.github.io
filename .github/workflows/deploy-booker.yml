# The meeting booker (booker/): test on every push that touches it; deploy to Cloudflare once
# it is set up. Same shape as eganator/sat-fordhamprep's deploy-site.yml.
#
# Deploying stays off until the repo variable BOOKER_DEPLOY is "true" (Settings -> Secrets and
# variables -> Actions -> Variables), so pushes don't fail before the Cloudflare side exists.
# Needs the repo variable CLOUDFLARE_ACCOUNT_ID and the repo secrets CLOUDFLARE_API_TOKEN,
# ALLOW_EMAILS, CAL_ICS_URL and TURNSTILE_SECRET. The last three are copied into the Worker
# as Worker secrets on every deploy. The Worker runs in Mike Egan's Cloudflare account.
name: Meeting booker

on:
  push:
    branches: [main]
    paths: ["booker/**", "style.css", ".github/workflows/deploy-booker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-booker
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: booker } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:e2e
        timeout-minutes: 10
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: dev-logs, path: "booker/.wrangler/*-dev.log", retention-days: 7 }

  deploy:
    needs: test
    if: vars.BOOKER_DEPLOY == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: booker } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm install --no-audit --no-fund
      - run: npx wrangler d1 migrations apply meeting-booker --remote
      - run: npx wrangler deploy
      # Repo secrets -> Worker secrets. Each value comes in through env and is piped to wrangler,
      # so it never appears in a command line or the log. A missing one stops the job rather than
      # replacing the Worker's secret with an empty value.
      - name: Set Worker secrets
        env:
          ALLOW_EMAILS: ${{ secrets.ALLOW_EMAILS }}
          CAL_ICS_URL: ${{ secrets.CAL_ICS_URL }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          for name in ALLOW_EMAILS CAL_ICS_URL TURNSTILE_SECRET; do
            if [ -z "${!name}" ]; then echo "::error::Repo secret $name is not set."; exit 1; fi
            printf '%s' "${!name}" | npx wrangler secret put "$name"
          done
